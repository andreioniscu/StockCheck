<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stocuri ALEXPC</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --panel: rgba(15, 23, 42, 0.86);
        --border: rgba(148, 163, 184, 0.22);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #818cf8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
        color: var(--text);
        background: linear-gradient(135deg, #020617 0%, #111827 100%);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(900px, 100%);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(2, 6, 23, 0.35);
        backdrop-filter: blur(18px);
        overflow: hidden;
      }

      .header {
        padding: 24px 28px 18px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(90deg, rgba(56, 189, 248, 0.16), rgba(129, 140, 248, 0.16));
      }

      .header h1 {
        margin: 0 0 8px;
        font-size: 1.4rem;
      }

      .header p {
        margin: 0;
        color: var(--muted);
      }

      .content {
        padding: 20px 28px 28px;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.16);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
        border-radius: 14px;
      }

      th,
      td {
        padding: 14px 16px;
        text-align: left;
      }

      thead {
        background: rgba(148, 163, 184, 0.14);
      }

      th {
        font-size: 0.85rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      tbody tr {
        border-top: 1px solid var(--border);
        transition: background 0.2s ease;
      }

      tbody tr:hover {
        background: rgba(56, 189, 248, 0.08);
      }

      .empty {
        text-align: center;
        padding: 26px 12px;
        color: var(--muted);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.12);
        color: #bae6fd;
        font-size: 0.85rem;
        font-weight: 600;
      }

      @media (max-width: 640px) {
        .header,
        .content {
          padding-left: 16px;
          padding-right: 16px;
        }

        th,
        td {
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="header">
        <h1>Stocuri ALEXPC</h1>
      </div>
      <div class="content">
        <div class="status" id="status">
          <span class="dot"></span>
          <span>Se incarca...</span>
        </div>
        <table id="stockTable" hidden>
          <thead>
            <tr>
              <th>Produs</th>
              <th>Stoc</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </main>

    <script>
      const statusEl = document.getElementById("status");
      const tableEl = document.getElementById("stockTable");
      const tbodyEl = tableEl.querySelector("tbody");

      function getParam(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name) || "";
      }

      async function loadStock() {
        const param = getParam("p");

        if (!param) {
          statusEl.innerHTML = '<span class="dot"></span><span>Eroare la preluarea datelor.</span>';
          return;
        }

        statusEl.innerHTML = '<span class="dot"></span><span>Se incarca...</span>';

        try {   
          const response = await fetch(`http://localhost:5265/stock?p=${encodeURIComponent(param)}`);
          if (!response.ok) {
            throw new Error(`Eroare ${response.status}`);
          }

          const data = await response.json();

          if (!Array.isArray(data) || data.length === 0) {
            tableEl.hidden = true;
            statusEl.innerHTML = '<span class="dot"></span><span>Nu s-au gasit rezultate.</span>';
            return;
          }

          tbodyEl.innerHTML = "";
          data.forEach((item) => {
            const row = document.createElement("tr");
            row.innerHTML = `
              <td>${(item.denprod || "-").replace(/</g, "&lt;").replace(/>/g, "&gt;")}</td>
              <td>${(item.stoc || "-").replace(/</g, "&lt;").replace(/>/g, "&gt;")}</td>
            `;
            tbodyEl.appendChild(row);
          });

          tableEl.hidden = false;
          statusEl.innerHTML = '<span class="dot"></span><span>AlexPC a partajat ' + data.length + ' produse.</span>';
        } catch (error) {
          tableEl.hidden = true;
          statusEl.innerHTML = '<span class="dot"></span><span>Eroare de incarcare: ' + error.message + '</span>';
        }
      }

      loadStock();
    </script>
  </body>
</html>
